<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MIU Routine v2</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo"><h1>Forgot Password</h1><p>Enter your Student ID to receive OTP via email</p></div>
            <form id="forgotForm">
                <div class="form-group"><label>Student ID</label><input type="text" id="studentId" placeholder="e.g., 2465cse01176" required></div>
                <button type="submit" class="btn btn-primary">Send OTP to Email</button>
            </form>
            <div class="auth-footer"><p><a href="login.html">← Back to Login</a></p></div>
            <div id="messageBox" class="error-message"></div>
        </div>
    </div>
    <footer class="footer"><p>&copy; 2026 MIU CSE Department | <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p></footer>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            var sid = document.getElementById('studentId').value.trim();
            var msg = document.getElementById('messageBox');
            var btn = e.target.querySelector('button');
            
            if (!sid) { msg.textContent = 'Enter Student ID'; msg.classList.add('show'); return; }
            
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';
            
            // Check Firebase if student exists
            var student = await findStudentById(sid);
            if (!student) {
                msg.textContent = 'Student ID not found';
                msg.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Send OTP to Email';
                return;
            }
            
            // Send OTP via Google Apps Script (generates, stores, and emails OTP)
            var result = await sendOTPFromSheet(sid);
            
            if (result.success) {
                msg.style.background = '#d4edda';
                msg.style.color = '#155724';
                msg.textContent = '✅ OTP sent to your email! Redirecting...';
                msg.classList.add('show');
                setTimeout(function(){ window.location.href = 'verify-otp.html?id=' + sid; }, 1500);
            } else {
                msg.textContent = result.error || 'Failed to send OTP. Try again.';
                msg.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Send OTP to Email';
            }
        });
    </script>
</body>
</html>
