<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MIU Routine v2</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo"><h1>Forgot Password</h1><p>Enter your Student ID to receive OTP</p></div>
            <form id="forgotForm">
                <div class="form-group"><label>Student ID</label><input type="text" id="studentId" placeholder="e.g., 2465cse01176" required></div>
                <button type="submit" class="btn btn-primary">Send OTP</button>
            </form>
            <div class="auth-footer"><p><a href="login.html">← Back to Login</a></p></div>
            <div id="messageBox" class="error-message"></div>
        </div>
    </div>
    <footer class="footer"><p>&copy; 2026 MIU CSE Department | <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p></footer>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const sid = document.getElementById('studentId').value.trim();
            const msg = document.getElementById('messageBox');
            const btn = e.target.querySelector('button');
            if (!sid) { msg.textContent = 'Enter Student ID'; msg.classList.add('show'); return; }
            btn.disabled = true; btn.textContent = 'Sending...';
            
            const student = await findStudentById(sid);
            if (!student) {
                msg.textContent = 'Student ID not found'; msg.classList.add('show');
                btn.disabled = false; btn.textContent = 'Send OTP'; return;
            }
            
            const otp = String(Math.floor(100000 + Math.random() * 900000));
            await storeOTP(sid, otp);
            alert('OTP sent! Your OTP is: ' + otp + '\n\n(Email sending requires Blaze plan. For demo, OTP shown here)');
            window.location.href = 'verify-otp.html?id=' + sid;
        });
    </script>
</body>
</html>
