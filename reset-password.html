<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MIU Routine v2</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo"><h1> Reset Password</h1><p>Enter your new password</p></div>
            <form id="resetForm">
                <div class="form-group"><label>New Password</label><input type="password" id="password" placeholder="Min 6 characters" required minlength="6"></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm password" required minlength="6"></div>
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
            <div class="auth-footer"><p><a href="login.html"> Back to Login</a></p></div>
            <div id="messageBox" class="error-message"></div>
        </div>
    </div>
    <footer class="footer"><p>&copy; 2026 MIU CSE Department | <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p></footer>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        var sid = new URLSearchParams(window.location.search).get('id');
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            var pw = document.getElementById('password').value;
            var cpw = document.getElementById('confirmPassword').value;
            var msg = document.getElementById('messageBox');
            var btn = e.target.querySelector('button');
            
            if (pw !== cpw) { msg.textContent = 'Passwords do not match!'; msg.classList.add('show'); return; }
            
            btn.disabled = true;
            btn.textContent = 'Resetting...';
            
            var hashedPw = simpleHash(pw);
            
            // Update Firebase
            var result = await resetStudentPassword(sid, hashedPw);
            
            if (result.success) {
                msg.style.background = '#d4edda';
                msg.style.color = '#155724';
                msg.textContent = '✅ Password reset! Redirecting...';
                msg.classList.add('show');
                setTimeout(function(){ window.location.href = 'login.html'; }, 2000);
            } else {
                msg.textContent = result.error;
                msg.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
