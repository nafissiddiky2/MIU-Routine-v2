<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - MIU Routine v2</title>
    <link rel="icon" type="image/png" href="images/manarat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo"><h1>Verify OTP</h1><p>Enter the 6-digit code sent to your email</p></div>
            <form id="otpForm">
                <div class="form-group"><label>OTP Code</label><input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" required></div>
                <button type="submit" class="btn btn-primary">Verify OTP</button>
            </form>
            <div class="auth-footer"><p><a href="forgot-password.html">← Resend OTP</a></p></div>
            <div id="messageBox" class="error-message"></div>
        </div>
    </div>
    <footer class="footer"><p>&copy; 2026 MIU CSE Department | <a href="https://nafissiddiky2.github.io/Portfolio/">S.A.Nafis</a></p></footer>

    <script>
        var SHEET_URL = 'https://script.google.com/macros/s/AKfycbyNUpRuevlE7dxTgSTykCfYT_cQDsLIKWDKvlJKpAPnEDKUswySTTN-d6sjik9InKGfxg/exec';
        var sid = new URLSearchParams(window.location.search).get('id');
        
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            var otp = document.getElementById('otp').value.trim();
            var msg = document.getElementById('messageBox');
            var btn = e.target.querySelector('button');
            
            if (otp.length !== 6) { msg.textContent = 'Enter 6-digit OTP'; msg.classList.add('show'); return; }
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            
            try {
                var res = await fetch(SHEET_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verify_otp', student_id: sid, otp: otp })
                });
                var data = await res.json();
                
                if (data.success) {
                    window.location.href = 'reset-password.html?id=' + sid;
                } else {
                    msg.textContent = data.error;
                    msg.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Verify OTP';
                }
            } catch (err) {
                msg.textContent = 'Connection error';
                msg.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Verify OTP';
            }
        });
    </script>
</body>
</html>
